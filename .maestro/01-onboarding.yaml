appId: com.explora.dev
name: First launch → skip onboarding → Browse
tags:
  - smoke
---
- launchApp:
    clearState: true
    permissions:
      all: deny
      # RN debug builds on Android 17+ prompt for this before loading the bundle from Metro.
      android.permission.ACCESS_LOCAL_NETWORK: allow
# First launch after clearState can wait on the JS bundle (Metro in debug).
- extendedWaitUntil:
    visible:
      id: onboarding-skip
    timeout: 30000
- tapOn:
    id: onboarding-skip
- extendedWaitUntil:
    visible:
      id: browse-title
    timeout: 15000
- assertVisible:
    id: tab-browse
- assertVisible:
    id: tab-search
- assertVisible:
    id: tab-favorites
- assertVisible:
    id: tab-settings
