# Fresh install state on the staging app, onboarding skipped, list loaded. Not measured.
appId: com.explora.staging
---
- launchApp:
    clearState: true
    permissions:
      all: deny
- extendedWaitUntil:
    visible:
      id: onboarding-skip
    timeout: 30000
- tapOn:
    id: onboarding-skip
# First card of the first section (Culture) with the seed: "Museum of Inventions #1".
- extendedWaitUntil:
    visible:
      id: activity-card-act-005-0
    timeout: 15000
