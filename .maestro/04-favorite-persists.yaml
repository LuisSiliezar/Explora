appId: com.explora.dev
name: Favorite survives an app kill (local-first)
tags:
  - smoke
---
- runFlow: subflows/launch-fresh.yaml
- runFlow: subflows/search-botanical.yaml
- tapOn:
    id: favorite-act-001
- stopApp
- launchApp:
    clearState: false
# The splash fades out over the already-mounted tabs; taps before that hit the splash.
- extendedWaitUntil:
    notVisible:
      id: splash
    timeout: 15000
- tapOn:
    id: tab-favorites
# First visit after a cold start mounts the Favorites screen; give it a moment.
- extendedWaitUntil:
    visible:
      id: activity-card-act-001
    timeout: 10000
